[project]
name = "agent-builder"
version = "0.1.0"
description = "An onboarding agent that turns a rough description into a stored, tool-equipped agent spec."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "litellm>=1.77",
    "mcp>=1.10,<2",
    "typer>=0.12",
    "pymongo>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
agent-builder = "agent_builder.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_builder"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/agent_builder/builders/base.py" = ["BLE001"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
